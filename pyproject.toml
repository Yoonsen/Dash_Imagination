[project]
name = "Dash_Imagination"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "yoonsen", email = "yoonsen@gmail.com"},
]
dependencies = [
    "flask",
    "flask-cors",
    "gunicorn",
    "dash>=2.18.2",
    "pandas>=2.2.3",
    "folium>=0.19.4",
    "leafmap>=0.42.11",
    "dhlab>=2.41.0",
    "dash-bootstrap-components>=1.7.1",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "kaleido>=0.2.1.post1",
    "XlsxWriter>=3.2.3",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false
package-dir = "src"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
